<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>สมุดคำอธิษฐาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Charm:wght@700&family=Mitr:wght@400;500&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:linear-gradient(180deg,#060b24,#121a4a 60%,#0a1438);color:#f4f1ea;font-family:"Sarabun",system-ui,sans-serif;padding:20px 14px 40px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font:700 40px/1.1 "Charm",serif;color:#ffd27a;text-align:center;text-shadow:0 0 16px rgba(255,190,90,.4)}
  .sub{text-align:center;font:400 13px "Mitr",sans-serif;color:#b9bfdc;margin-top:4px}
  .bar{display:flex;gap:8px;margin:16px 0 8px}
  input{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:12px;color:#f4f1ea;font:400 15px "Sarabun",sans-serif;padding:10px 12px;outline:none}
  input:focus{border-color:#ffd27a}
  button{border:1px solid rgba(255,210,122,.6);background:rgba(8,13,42,.8);color:#ffd27a;font:500 14px "Mitr",sans-serif;padding:0 14px;border-radius:12px;cursor:pointer}
  .count{font:400 13px "Mitr",sans-serif;color:#b9bfdc;margin:4px 2px 6px}
  ul{list-style:none}
  li{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;margin-top:10px}
  .n{font:500 15px "Mitr",sans-serif;color:#ffd27a;display:flex;justify-content:space-between;gap:8px}
  .n small{font:400 12px "Mitr",sans-serif;color:#b9bfdc;white-space:nowrap}
  .w{font-size:16px;line-height:1.5;margin-top:4px;white-space:pre-wrap;word-break:break-word}
  .d{font-size:12px;color:#9aa1c7;margin-top:6px}
  .msg{text-align:center;color:#b9bfdc;padding:40px 10px;font:400 15px "Mitr",sans-serif;line-height:1.6}
  a{color:#ffd27a}
</style>
</head>
<body>
<div class="wrap">
  <h1>สมุดคำอธิษฐาน</h1>
  <div class="sub">ลอยกระทงออนไลน์ · หน้านี้สำหรับเจ้าของเว็บเท่านั้น</div>
  <div class="bar"><input id="q" type="search" placeholder="ค้นหาชื่อหรือคำอธิษฐาน"><button id="reload" type="button">รีเฟรช</button></div>
  <div class="count" id="count"></div>
  <ul id="list"></ul>
  <div class="msg" id="msg">กำลังโหลด…</div>
</div>
<script>
(() => {
  const SB_URL = "https://agncwlvtxaiatbynwnms.supabase.co";
  const SB_KEY = "sb_publishable_eDcbffTfCDQgKSagZDhH5g__2pCMOk5";
  const TYPE = {leaf: "🍃 ใบตอง", bread: "🍞 ขนมปัง", hyacinth: "🌸 ผักตบชวา", coconut: "🥥 กะลา"};
  const key = decodeURIComponent(location.hash.slice(1));
  const list = document.getElementById("list"), msg = document.getElementById("msg"), count = document.getElementById("count"), q = document.getElementById("q");
  let all = [];

  function render() {
    const term = q.value.trim().toLowerCase();
    const rows = term ? all.filter(it => (it.name + " " + it.wish).toLowerCase().includes(term)) : all;
    count.textContent = `ทั้งหมด ${all.length.toLocaleString("th-TH")} คำอธิษฐาน` + (term ? ` · ตรงกับที่ค้นหา ${rows.length}` : "");
    list.textContent = "";
    rows.forEach(it => {
      const li = document.createElement("li");
      const n = document.createElement("div"); n.className = "n";
      const nm = document.createElement("span"); nm.textContent = it.name;
      const tp = document.createElement("small"); tp.textContent = TYPE[it.type] || "";
      n.append(nm, tp);
      const w = document.createElement("div"); w.className = "w"; w.textContent = it.wish || "—";
      const d = document.createElement("div"); d.className = "d";
      d.textContent = new Date(it.at).toLocaleString("th-TH", {dateStyle: "medium", timeStyle: "short"});
      li.append(n, w, d); list.appendChild(li);
    });
    msg.style.display = all.length ? "none" : "block";
    if (!all.length) msg.textContent = "ยังไม่มีใครอธิษฐาน 🪷";
  }

  async function load() {
    if (!key) { msg.textContent = "ลิงก์นี้ไม่ถูกต้อง ใช้ลิงก์ส่วนตัวที่ได้รับเท่านั้น"; return; }
    try {
      const r = await fetch(SB_URL + "/rest/v1/rpc/krathong_wishes", {
        method: "POST", headers: {"apikey": SB_KEY, "Content-Type": "application/json"},
        body: JSON.stringify({owner_key: key})
      });
      const j = await r.json();
      if (!r.ok || !j) { msg.textContent = "ลิงก์นี้ไม่ถูกต้อง ใช้ลิงก์ส่วนตัวที่ได้รับเท่านั้น"; list.textContent = ""; count.textContent = ""; return; }
      all = j.items || [];
      render();
    } catch (e) { msg.style.display = "block"; msg.textContent = "โหลดไม่ได้ ลองกดรีเฟรชอีกครั้ง"; }
  }
  q.oninput = render;
  document.getElementById("reload").onclick = load;
  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
